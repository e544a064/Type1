# Pins the JVM used by the Gradle daemon (Gradle 8.8+ daemon JVM criteria).
#
# Gradle 8.11's embedded Kotlin 2.0 script compiler cannot parse the version
# string of JDK 24+ and fails with a bare "27.0.1.0.3" IllegalArgumentException,
# so the daemon must run on JDK 21 regardless of JAVA_HOME / PATH.
toolchainVersion=21
