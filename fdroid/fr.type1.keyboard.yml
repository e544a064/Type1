Builds:
  - versionName: '0.3.8'
    versionCode: 3008
    commit: v0.3.8
    ndk: 27.0.12077973
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang rustup
    prebuild:
      - rustup default stable
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - cargo install cargo-ndk --locked
    gradle:
      - yes
    gradleprops:
      - requireRust=true

